name: Hermes Mainnet CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Frontend Dependencies
      working-directory: ./dashboard
      run: npm install

    - name: Build Next.js Dashboard
      working-directory: ./dashboard
      # Desativa lint rigoroso caso existam types rapidos do explorador 
      env:
        NEXT_TELEMETRY_DISABLED: 1
      run: |
        npx next build

    - name: Verify Backend Integrity (Python Web3)
      run: |
        python -m pip install --upgrade pip
        pip install -r agent/requirements.txt
        echo "✅ Motor MEV instalado e integrado com Web3 OK."
